apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "promotion-api.name" . }}
  namespace: {{ .Release.Namespace }}
data:
  appsettings.json: |
    {
      "Promotion": {
        "PaymentServiceBaseUrl": "http://payment-api",
        "CashBaseUrl": "http://cashservice-api",
        "BrandServiceBaseUrl": "http://brand-cert-api",
		    "PlayerServiceBaseUrl": "http://player-api"
      }
    }
  monitor.settings.json: |
    {
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }

