include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml

variables:
  ImageName: pgtgs/promotion-api
  TgsSettingKey: promotion-api
  HelmTemplateFolderName: promotion-api
  BuildCacheKey: Tgs.Promotion.$CI_PIPELINE_IID

stages:
  - build
  - test
  - publish
  - deploy-dev
  - deploy-staging
  - deploy-prod

build-code:
  extends: .build-code-template

unit-test:
  extends: .unit-test-template

push-nuget:
  extends: .push-nuget-template
  script:
    - push_package "Tgs.Promotion.Client"
  artifacts:
    paths:
      - Tgs.Promotion.Client/bin/$BuildConfiguration/*.nupkg

push-docker-image:
  extends: .push-docker-image-template
  script:
    - push_docker "Tgs.Promotion.Service" $ImageName $Tag

push-k8s-template:
  extends: .push-k8s-template
  script:
    - push_k8s_template $HelmTemplateFolderName $ImageName $Tag

deploy-dev:
  extends: .deploy-k8s-template
  variables:
    namespace: dev
    kube_config: KubeConfig_Raypro_dev
  environment:
    name: dev
  stage: deploy-dev
  needs:
    - push-nuget
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  tags:
    - dev
    - kubernetes
    - deploy
  only:
    - main
  when: on_success
  script:
    - deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace

deploy-staging:
  extends: .deploy-k8s-template
  variables:
    namespace: staging
    kube_config: KubeConfig_Raypro_staging
  environment:
    name: staging
  stage: deploy-staging
  needs:
    - deploy-dev
    - job: push-k8s-template
      artifacts: true
  tags:
    - dev
    - kubernetes
    - deploy
  only:
    - main
  when: manual
  script:
    - deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace

deploy-prod:
  extends: .deploy-k8s-template
  variables:
    namespace: prod
    kube_config: KubeConfig_Raypro_prod
  environment:
    name: prod
  stage: deploy-prod
  needs:
    - deploy-staging
    - job: push-k8s-template
      artifacts: true
  tags:
    - dev
    - kubernetes
    - deploy
  only:
    - main
  when: manual
  script:
    - deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace
